<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dans La Cuisine</title>
<style>
  :root {
    --accent: #E60E2B;
    --warm-cream: #FBF7F2;
    --soft-pink: #FCE9E6;
    --ink: #1F2937;
    --muted: #6B7280;
    --border: #E5E7EB;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--warm-cream);
    color: var(--ink);
    line-height: 1.55;
    padding: 48px 24px 120px;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  .header-top {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; margin-bottom: 14px;
  }
  .header-brand { flex: 1; min-width: 0; }
  header h1 { margin: 0 0 4px; font-size: 36px; font-weight: 700; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); font-size: 16px; }
  .header-right {
    display: flex; align-items: center; gap: 8px; flex-shrink: 0; padding-top: 4px;
  }
  .header-controls {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }

  /* Basket button in header */
  .basket-header-btn {
    position: relative; background: #fff; border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 12px; font-size: 16px; cursor: pointer;
    font-family: inherit; transition: border-color 0.15s; line-height: 1;
  }
  .basket-header-btn:hover { border-color: var(--accent); }
  .basket-badge {
    position: absolute; top: -7px; right: -7px;
    background: var(--accent); color: #fff; border-radius: 999px;
    font-size: 10px; font-weight: 700; min-width: 17px; height: 17px;
    display: none; align-items: center; justify-content: center; padding: 0 3px;
  }
  .basket-badge.show { display: flex; }

  /* Per-card basket button */
  .card-basket-btn {
    position: absolute; top: 10px; right: 10px; z-index: 3;
    background: rgba(255,255,255,0.92); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 7px; font-size: 14px; line-height: 1;
    cursor: pointer; transition: all 0.15s;
  }
  .card-basket-btn:hover { border-color: var(--accent); background: var(--soft-pink); }
  .card-basket-btn.in-basket { background: var(--accent); border-color: var(--accent); }

  .servings-control {
    display: inline-flex; align-items: center; gap: 4px;
    background: #fff; border: 1px solid var(--border); border-radius: 8px;
    padding: 4px 6px 4px 14px; font-size: 14px;
  }
  .servings-control .label { color: var(--muted); font-size: 13px; margin-right: 4px; }
  .servings-control .value { font-weight: 600; min-width: 24px; text-align: center; font-variant-numeric: tabular-nums; }
  .servings-btn {
    width: 28px; height: 28px; border-radius: 6px; border: 0; background: #F3F4F6;
    cursor: pointer; font-size: 16px; font-weight: 600; color: var(--ink);
    display: flex; align-items: center; justify-content: center;
  }
  .servings-btn:hover { background: var(--soft-pink); color: var(--accent); }
  .servings-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--ink);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #C00B23; border-color: #C00B23; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { background: #F3F4F6; color: var(--ink); }
  .btn.danger { color: #B91C1C; }
  .btn.danger:hover { border-color: #B91C1C; }
  .btn.small { padding: 6px 12px; font-size: 13px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Filters */
  .filters {
    background: #fff; border: 1px solid var(--border); border-radius: 14px;
    padding: 18px 22px 16px; margin-bottom: 28px;
  }
  .filter-group { margin-bottom: 12px; }
  .filter-group:last-of-type { margin-bottom: 0; }
  .filter-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted); margin-bottom: 8px;
  }
  .filter-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill {
    border: 1px solid var(--border); background: #fff; color: var(--ink);
    padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 13px;
    transition: all 0.15s; font-family: inherit;
  }
  .pill:hover { border-color: var(--accent); }
  .pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .filter-footer {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
  }
  .filter-count { font-size: 13px; color: var(--muted); }
  .filter-clear {
    background: transparent; border: 0; color: var(--accent); cursor: pointer;
    font-size: 13px; font-weight: 500; padding: 4px 8px; font-family: inherit;
  }
  .filter-clear:hover { text-decoration: underline; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

  .card {
    position: relative; display: flex; flex-direction: column; background: #fff;
    border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
    text-decoration: none; color: inherit;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    cursor: pointer; text-align: left; padding: 0; font: inherit;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,0.08); border-color: var(--accent); }
  .card-image { width: 100%; height: 160px; object-fit: cover; display: block; background: #F3F4F6; }
  .card-top { background: var(--soft-pink); padding: 18px 20px 16px; border-bottom: 1px solid var(--border); position: relative; }
  .rcode { font-size: 12px; font-weight: 600; color: var(--accent); letter-spacing: 0.04em; margin-bottom: 6px; }
  .card h2 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.3; }
  .card-body { padding: 16px 20px 18px; flex: 1; display: flex; flex-direction: column; }
  .desc { font-size: 14px; color: #374151; margin: 0 0 14px; flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
  .tag { font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 999px; background: #F3F4F6; color: #4B5563; }
  .tag.veg { background: #D1FAE5; color: #065F46; }
  .tag.fish { background: #DBEAFE; color: #1E40AF; }
  .tag.meat { background: #FEE2E2; color: #991B1B; }
  .tag.quick { background: #FEF3C7; color: #92400E; }
  .tag.custom { background: #EDE9FE; color: #5B21B6; }
  .tag.community { background: #E0F2FE; color: #0369A1; }

  /* Card selected state (basket) */
  .card.in-basket { border-color: var(--accent); }

  .empty-state {
    background: #fff; border: 1px dashed var(--border); border-radius: 14px;
    padding: 40px; text-align: center; color: var(--muted);
  }

  /* View tabs */
  .view-tabs { display: flex; gap: 6px; margin-bottom: 20px; justify-content: center; }
  .view-tab {
    background: #fff; border: 1px solid var(--border); padding: 10px 22px;
    border-radius: 999px; cursor: pointer; font-size: 14px; font-family: inherit;
    color: var(--ink); font-weight: 500;
  }
  .view-tab:hover { border-color: var(--accent); }
  .view-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* Pantry */
  .pantry-intro {
    background: #fff; border: 1px solid var(--border); border-radius: 14px;
    padding: 20px 22px; margin-bottom: 24px; color: #374151; font-size: 14px;
  }
  .pantry-intro strong { color: var(--ink); }
  .pantry-section { margin-bottom: 28px; }
  .pantry-section h3 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent);
    margin: 0 0 12px; padding-bottom: 6px; border-bottom: 2px solid var(--soft-pink);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .pantry-section h3 .pantry-count { color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: 0.04em; text-transform: none; }
  .pantry-list { margin: 0; padding: 0; list-style: none; }
  .pantry-item { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px; }
  .pantry-item-header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px; }
  .pantry-item-name { font-weight: 600; font-size: 14px; color: var(--ink); }
  .pantry-item-recipes-count { color: var(--muted); font-size: 12px; }
  .pantry-recipe-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .pantry-recipe-tag {
    background: var(--soft-pink); color: var(--accent); padding: 2px 8px;
    border-radius: 999px; font-size: 11px; font-weight: 500;
    border: 0; cursor: pointer; font-family: inherit;
  }
  .pantry-recipe-tag:hover { background: var(--accent); color: #fff; }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,0.55); backdrop-filter: blur(3px);
    display: none; align-items: flex-start; justify-content: center;
    padding: 40px 16px; z-index: 50; overflow-y: auto;
  }
  .overlay.open { display: flex; }
  .modal {
    background: #fff; border-radius: 16px; max-width: 820px; width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25); position: relative; padding: 40px 44px 48px;
  }
  .modal-close {
    position: absolute; top: 16px; right: 16px; background: #F3F4F6; border: 0;
    border-radius: 50%; width: 36px; height: 36px; font-size: 22px; cursor: pointer;
    color: #4B5563; line-height: 1;
  }
  .modal-close:hover { background: #E5E7EB; }
  .modal h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.2; padding-right: 40px; }
  .modal .meta { color: var(--muted); font-size: 14px; margin-bottom: 6px; }
  .modal .meta-rcode { color: var(--accent); font-weight: 600; letter-spacing: 0.04em; }
  .modal .meta-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 24px; }
  .modal-section { margin-top: 28px; }
  .modal-section h3 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent);
    margin: 0 0 12px; padding-bottom: 6px; border-bottom: 2px solid var(--soft-pink);
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-section h3 .section-meta { color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: 0.04em; text-transform: none; }
  .modal-photo { width: 100%; max-height: 360px; object-fit: cover; border-radius: 12px; margin-bottom: 20px; }
  .modal-link-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent); color: #fff; padding: 10px 18px; border-radius: 8px;
    text-decoration: none; font-weight: 500; margin-bottom: 16px; font-size: 14px;
  }
  .modal-link-btn:hover { background: #C00B23; }
  .ingredients {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; margin: 0; padding: 0; list-style: none;
  }
  .ingredients li {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    padding: 5px 0; border-bottom: 1px dotted #E5E7EB; font-size: 14px;
  }
  .ingredients li .qty { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; white-space: nowrap; }
  .method { margin: 0; padding: 0; list-style: none; counter-reset: step; }
  .method li { counter-increment: step; position: relative; padding: 0 0 18px 44px; font-size: 15px; }
  .method li::before {
    content: counter(step); position: absolute; left: 0; top: 0; width: 30px; height: 30px;
    background: var(--accent); color: #fff; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
  }
  .pantry, .allergens, .method-note {
    background: #F9FAFB; border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #4B5563; margin-top: 10px;
  }
  .pantry strong, .allergens strong, .method-note strong { color: var(--ink); margin-right: 6px; }
  .modal-actions {
    display: flex; justify-content: flex-end; gap: 10px;
    margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border);
  }

  /* Form */
  .form-row { margin-bottom: 16px; }
  .form-row label {
    display: block; font-size: 12px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px;
  }
  .form-row input[type=text],
  .form-row input[type=url],
  .form-row input[type=number],
  .form-row input[type=password],
  .form-row select,
  .form-row textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; font-family: inherit; background: #fff; color: var(--ink);
  }
  .form-row textarea { resize: vertical; min-height: 80px; }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(230,14,43,0.1);
  }
  .form-hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .source-tabs {
    display: flex; gap: 6px; margin-bottom: 14px;
    border-bottom: 1px solid var(--border); padding-bottom: 12px; flex-wrap: wrap;
  }
  .source-tab {
    background: transparent; border: 1px solid var(--border); padding: 8px 14px;
    border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit; color: var(--ink);
  }
  .source-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .source-tab:hover:not(.active) { border-color: var(--accent); }
  .image-preview { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .image-preview img { max-width: 120px; max-height: 120px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); }
  .ai-callout {
    background: linear-gradient(135deg,#FCE9E6 0%,#EDE9FE 100%);
    border-radius: 10px; padding: 14px 16px; margin-top: 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .ai-callout-text { font-size: 13px; color: var(--ink); }
  .ai-callout-text strong { display: block; margin-bottom: 2px; font-size: 14px; }
  .extract-status { margin-top: 12px; padding: 12px 16px; border-radius: 8px; background: #EFF6FF; color: #1E40AF; font-size: 13px; }
  .extract-status.error { background: #FEE2E2; color: #B91C1C; }
  .extract-status.success { background: #D1FAE5; color: #065F46; }

  /* Shopping list */
  .shop-list-section { margin-top: 24px; }
  .shop-list-section h3 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent);
    margin: 0 0 12px; padding-bottom: 6px; border-bottom: 2px solid var(--soft-pink);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .aisle-count { color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: 0.04em; text-transform: none; }
  .shop-list { margin: 0; padding: 0; list-style: none; }
  .shop-list li { display: flex; align-items: flex-start; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .shop-list li:hover { background: #FAFAFA; }
  .shop-list input[type=checkbox] { margin: 4px 0 0; width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }
  .shop-list label { flex: 1; cursor: pointer; line-height: 1.4; }
  .shop-list .item-row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .shop-list .item-name { font-weight: 500; color: var(--ink); }
  .shop-list .item-qty { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; white-space: nowrap; }
  .shop-list .item-recipes { color: var(--muted); font-size: 11px; font-style: italic; margin-top: 2px; }
  .shop-list li.checked label .item-name,
  .shop-list li.checked label .item-qty { text-decoration: line-through; opacity: 0.5; }
  .recipes-pill-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .recipes-pill-row .tag { background: var(--soft-pink); color: var(--accent); }
  .pantry-callout { margin-top: 16px; background: #F9FAFB; border-radius: 8px; padding: 12px 14px; font-size: 13px; color: #4B5563; }
  .pantry-callout strong { color: var(--ink); }

  footer { margin-top: 48px; text-align: center; color: var(--muted); font-size: 13px; }

  /* ===== AUTH STYLES ===== */

  /* User menu button (shown when signed in) */
  .user-menu {
    display: none; align-items: center; gap: 5px;
    background: #fff; border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 8px 4px 4px; cursor: pointer;
    position: relative; font-family: inherit;
  }
  .user-menu:hover { border-color: var(--accent); }
  .user-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; flex-shrink: 0; pointer-events: none;
  }
  .user-caret { color: var(--muted); font-size: 10px; pointer-events: none; }
  .user-dropdown {
    position: absolute; top: calc(100% + 6px); right: 0;
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.10); min-width: 180px; z-index: 100;
    overflow: hidden; display: none;
  }
  .user-dropdown.open { display: block; }
  .user-dropdown button {
    display: block; width: 100%; text-align: left; padding: 11px 16px;
    background: none; border: 0; font-size: 14px; cursor: pointer; font-family: inherit; color: var(--ink);
  }
  .user-dropdown button:hover { background: #F9FAFB; }
  .user-dropdown button.danger { color: #B91C1C; }
  .dd-name { padding: 10px 16px 2px; font-size: 14px; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd-email { padding: 2px 16px 6px; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd-divider { height: 1px; background: var(--border); margin: 4px 0; }

  /* Auth modal overlay */
  .auth-overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,0.55); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; padding: 24px 16px; z-index: 60;
  }
  .auth-overlay.open { display: flex; }
  .auth-modal {
    background: #fff; border-radius: 16px; max-width: 420px; width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25); position: relative; padding: 40px 36px 36px;
  }
  .auth-close {
    position: absolute; top: 14px; right: 14px; background: #F3F4F6; border: 0;
    border-radius: 50%; width: 34px; height: 34px; font-size: 20px; cursor: pointer;
    color: #4B5563; display: flex; align-items: center; justify-content: center;
  }
  .auth-close:hover { background: #E5E7EB; }
  .auth-title { font-size: 24px; font-weight: 700; margin: 0 0 4px; }
  .auth-sub { font-size: 14px; color: var(--muted); margin: 0 0 22px; }
  .auth-tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
  .auth-tab {
    background: none; border: 0; padding: 8px 16px 10px; cursor: pointer;
    font-size: 14px; font-weight: 500; color: var(--muted); font-family: inherit;
    border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s;
  }
  .auth-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .auth-error {
    background: #FEE2E2; color: #B91C1C; padding: 10px 14px; border-radius: 8px;
    font-size: 13px; margin-bottom: 14px; display: none;
  }
  .auth-error.show { display: block; }
  .google-btn {
    width: 100%; padding: 11px; border: 1px solid var(--border); border-radius: 8px;
    background: #fff; cursor: pointer; font-size: 14px; font-weight: 500; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: all 0.15s; color: var(--ink);
  }
  .google-btn:hover { border-color: #4285F4; background: #F8F9FF; }
  .auth-divider { display: flex; align-items: center; gap: 10px; margin: 16px 0; font-size: 12px; color: var(--muted); }
  .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .auth-submit {
    width: 100%; margin-top: 6px; padding: 11px; background: var(--accent);
    color: #fff; border: 0; border-radius: 8px; font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: background 0.15s;
  }
  .auth-submit:hover { background: #C00B23; }

  /* Visibility toggle in Add Recipe */
  .visibility-row {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: #F9FAFB; border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 16px; margin-bottom: 16px;
  }
  .visibility-label { font-size: 13px; color: #374151; flex: 1; min-width: 160px; }
  .visibility-label strong { display: block; font-size: 14px; color: var(--ink); margin-bottom: 2px; }

<script>

const FIREBASE_CONFIG = {

  authDomain: "recipe-book-ad5fe.firebaseapp.com",

const FIREBASE_ENABLED = !FIREBASE_CONFIG.apiKey.startsWith('REPLACE');

let firebaseAuth, firebaseDb;

// ============ Auth state ============

let currentUser        = null;
let firestoreRecipes   = [];
let publicUnsubscribe  = null;
let privateUnsubscribe = null;

function updateAuthUI() {
  const userAvatar       = document.getElementById('user-avatar');
  const nameEl           = document.getElementById('user-name-display');
  const emailEl          = document.getElementById('user-email-display');
  const authDivider      = document.getElementById('dd-auth-divider');

  const footerEl         = document.getElementById('footer-text');

  const show = (el, v) => { if (el) el.classList.toggle('dd-hidden', !v); };

  if (currentUser) {
    const firstName   = loadFirstName();
    const displayName = firstName || currentUser.displayName || currentUser.email.split('@')[0];
    userAvatar.textContent = displayName.charAt(0).toUpperCase();
    if (nameEl)  nameEl.textContent  = displayName;
    if (emailEl) emailEl.textContent = currentUser.email;
    show(nameEl, true); show(emailEl, true);
    show(authDivider, true); show(signinBtn, false);
    show(settingsBtn, true); show(signoutBtn, true);
    if (footerEl) footerEl.textContent = 'Signed in as ' + currentUser.email + '. New recipes save to the cloud.';
  } else {
    userAvatar.textContent = '?';
    show(nameEl, false); show(emailEl, false);

    if (footerEl) footerEl.textContent = 'Recipes you add are saved in your browser. Sign in to save to the cloud and share with others.';
  }
  updateTitle();
}

if (FIREBASE_ENABLED) {
  // Always show public community recipes, even before sign-in
  startPublicListener();

  firebaseAuth.onAuthStateChanged(function(user) {
    currentUser = user;
    // If signing in via Google and we don't have a stored first name yet, extract it
    if (user && user.displayName && !loadFirstName()) {
      saveFirstName(user.displayName.split(' ')[0]);
    }
    if (user) fetchGeminiKey(); else _geminiKey = null;
    updateAuthUI();
    if (user) {
      startPrivateListener(user.uid);
    } else {
      stopPrivateListener();
    }
  });
}

// If Firebase isn't configured, keep sign-in dropdown item hidden (already dd-hidden by default)

// ============ Firestore listeners ============

function startPublicListener() {
  if (publicUnsubscribe) return;
  publicUnsubscribe = firebaseDb.collection('recipes')
    .where('isPublic', '==', true)
    .onSnapshot(function(snap) {
      var publicRecipes = snap.docs.map(function(doc) {
        var d = doc.data();
        d.ingredients = ingredientsFromFs(d.ingredients);
        return Object.assign({}, d, { firestoreId: doc.id, custom: true, _fsSource: 'public' });
      });
      firestoreRecipes = firestoreRecipes.filter(function(r) { return r._fsSource === 'private'; }).concat(publicRecipes);
      renderFilters();
      renderGrid();
    }, function(err) { console.warn('Public recipes error:', err.message); });
}

function startPrivateListener(userId) {
  if (privateUnsubscribe) { privateUnsubscribe(); privateUnsubscribe = null; }
  privateUnsubscribe = firebaseDb.collection('recipes')
    .where('userId', '==', userId)
    .where('isPublic', '==', false)
    .onSnapshot(function(snap) {
      var privateRecipes = snap.docs.map(function(doc) {
        var d = doc.data();
        d.ingredients = ingredientsFromFs(d.ingredients);
        return Object.assign({}, d, { firestoreId: doc.id, custom: true, _fsSource: 'private' });
      });
      firestoreRecipes = firestoreRecipes.filter(function(r) { return r._fsSource !== 'private'; }).concat(privateRecipes);
      renderFilters();
      renderGrid();
    }, function(err) { console.warn('Private recipes error:', err.message); });
}

function stopPrivateListener() {
  if (privateUnsubscribe) { privateUnsubscribe(); privateUnsubscribe = null; }
  firestoreRecipes = firestoreRecipes.filter(function(r) { return r._fsSource !== 'private'; });
  renderFilters();
  renderGrid();
}

// ============ Auth modal ============

function openAuthModal(mode) {
  mode = mode || 'signin';
  if (!FIREBASE_ENABLED) {
    alert('Firebase is not configured yet.\nFill in FIREBASE_CONFIG in index.html first (see setup guide).');
    return;
  }
  renderAuthModal(mode);
  document.getElementById('auth-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeAuthModal() {
  document.getElementById('auth-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function renderAuthModal(mode) {
  var c = document.getElementById('auth-modal-content');
  c.innerHTML = '';

  c.appendChild(el('div', { class: 'auth-title' }, mode === 'signin' ? 'Welcome back' : 'Create account'));
  c.appendChild(el('div', { class: 'auth-sub'   }, mode === 'signin' ? 'Sign in to access your recipes' : 'Save and share recipes with others'));

  // Tabs
  var tabs = el('div', { class: 'auth-tabs' });
  tabs.appendChild(el('button', {
    class: 'auth-tab' + (mode === 'signin' ? ' active' : ''),
    type: 'button', onclick: function() { renderAuthModal('signin'); }
  }, 'Sign in'));
  tabs.appendChild(el('button', {
    class: 'auth-tab' + (mode === 'signup' ? ' active' : ''),
    type: 'button', onclick: function() { renderAuthModal('signup'); }
  }, 'Create account'));
  c.appendChild(tabs);

  // Error
  c.appendChild(el('div', { class: 'auth-error', id: 'auth-error' }));

  // Google button
  var googleBtn = el('button', { class: 'google-btn', type: 'button', onclick: signInWithGoogle });
  googleBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908C16.658 14.013 17.64 11.705 17.64 9.2z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/></svg>Continue with Google';
  c.appendChild(googleBtn);

  c.appendChild(el('div', { class: 'auth-divider' }, 'or'));

  // First name (for sign-up: required; for sign-in: optional to set/update)
  var nameRow = el('div', { class: 'form-row' });
  nameRow.appendChild(el('label', { for: 'auth-firstname' }, 'First name' + (mode === 'signin' ? ' (optional)' : '')));
  var nameInput = el('input', {
    type: 'text', id: 'auth-firstname',
    placeholder: mode === 'signup' ? 'Your first name' : loadFirstName() || 'Your first name',
    autocomplete: 'given-name'
  });
  if (mode === 'signin' && loadFirstName()) nameInput.value = loadFirstName();
  nameRow.appendChild(nameInput);
  c.appendChild(nameRow);

  // Email
  var emailRow = el('div', { class: 'form-row' });
  emailRow.appendChild(el('label', { for: 'auth-email' }, 'Email'));
  emailRow.appendChild(el('input', { type: 'text', id: 'auth-email', placeholder: 'you@example.com', autocomplete: 'email' }));
  c.appendChild(emailRow);

  // Password
  var pwRow = el('div', { class: 'form-row' });
  pwRow.appendChild(el('label', { for: 'auth-password' }, 'Password'));
  pwRow.appendChild(el('input', {

  var submitBtn = el('button', {

  }, mode === 'signin' ? 'Sign in' : 'Create account');
  c.appendChild(submitBtn);

  // Focus email field and wire up Enter key
  setTimeout(function() {
    var ei = document.getElementById('auth-email');
    var pi = document.getElementById('auth-password');
    if (ei) ei.focus();
    [ei, pi].forEach(function(inp) {
      if (inp) inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') submitBtn.click(); });

}

function showAuthError(msg) {
  var e = document.getElementById('auth-error');
  if (e) { e.textContent = msg; e.classList.add('show'); }
}
function clearAuthError() {
  var e = document.getElementById('auth-error');
  if (e) e.classList.remove('show');
}

function doEmailSignIn() {
  clearAuthError();
  var email     = document.getElementById('auth-email').value.trim();
  var password  = document.getElementById('auth-password').value;
  var firstName = (document.getElementById('auth-firstname')?.value || '').trim();
  if (!email || !password) { showAuthError('Please enter your email and password.'); return; }
  firebaseAuth.signInWithEmailAndPassword(email, password)
    .then(function() {
      if (firstName) { saveFirstName(firstName); updateTitle(); }
      closeAuthModal();
    })
    .catch(function(e) { showAuthError(friendlyAuthError(e.code)); });
}

function doEmailSignUp() {
  clearAuthError();
  var email     = document.getElementById('auth-email').value.trim();
  var password  = document.getElementById('auth-password').value;
  var firstName = (document.getElementById('auth-firstname')?.value || '').trim();
  if (!email || !password) { showAuthError('Please enter your email and password.'); return; }
  if (!firstName) { showAuthError('Please enter your first name.'); return; }
  firebaseAuth.createUserWithEmailAndPassword(email, password)
    .then(function(result) {
      saveFirstName(firstName);
      updateTitle();
      return result.user.updateProfile({ displayName: firstName });
    })
    .then(function() { closeAuthModal(); })
    .catch(function(e) { showAuthError(friendlyAuthError(e.code)); });
}

function signInWithGoogle() {
  clearAuthError();
  var provider = new firebase.auth.GoogleAuthProvider();
  firebaseAuth.signInWithPopup(provider)
    .then(function(result) {
      if (result.user.displayName && !loadFirstName()) {
        saveFirstName(result.user.displayName.split(' ')[0]);
        updateTitle();
      }
      closeAuthModal();
    })
    .catch(function(e) { if (e.code !== 'auth/popup-closed-by-user') showAuthError(friendlyAuthError(e.code)); });
}

function doSignOut() {
  firebaseAuth.signOut().then(function() { closeUserDropdown(); });
}

function friendlyAuthError(code) {
  var map = {
    'auth/user-not-found':        'No account found with this email.',
    'auth/wrong-password':        'Incorrect password.',
    'auth/invalid-credential':    'Email or password is incorrect.',
    'auth/email-already-in-use':  'An account already exists with this email.',
    'auth/weak-password':         'Password must be at least 6 characters.',
    'auth/invalid-email':         'Please enter a valid email address.',
    'auth/too-many-requests':     'Too many attempts — please try again later.',
    'auth/network-request-failed':'Network error. Check your connection.'
  };
  return map[code] || 'Something went wrong. Please try again.';
}

function saveCustom(a)  { localStorage.setItem(STORAGE_KEY, JSON.stringify(a)); }

async function fetchGeminiKey() {
  if (!FIREBASE_ENABLED || !currentUser) return;

    const doc = await firebaseDb.collection('_config').doc('gemini').get();

// ============ Helpers ============

function el(tag, attrs, ...children) {
  attrs = attrs || {};
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}

function timeBucket(min) {
  if (min == null) return null;
  if (min <= 20) return '≤20 min';
  if (min <= 35) return '20–35 min';
  return '35+ min';
}
const TIME_ORDER = ['≤20 min','20–35 min','35+ min'];

// ============ Quantity parsing & scaling ============

function parseQty(qty) {
  if (!qty||qty==='—') return null;
  const s = qty.replace(/½/g,'.5').replace(/¼/g,'.25').replace(/¾/g,'.75').trim();
  let m = s.match(/^(\d+(?:\.\d+)?)\s*[×x]\s*(\d+(?:\.\d+)?)\s*([a-zA-Z]+)?$/);
  if (m) return { value: parseFloat(m[1])*parseFloat(m[2]), unit: m[3]||'count' };
  m = s.match(/^(\d+(?:\.\d+)?)\s*([a-zA-Z]+)?$/);
  if (m) return { value: parseFloat(m[1]), unit: m[2]||'count' };
  return null;
}

function formatFraction(val) {
  const whole = Math.floor(val);
  const frac  = Math.round((val-whole)*100)/100;
  let fracStr = '';
  if (Math.abs(frac-0.25)<0.01) fracStr='¼';
  else if (Math.abs(frac-0.5)<0.01) fracStr='½';
  else if (Math.abs(frac-0.75)<0.01) fracStr='¾';
  if (fracStr && whole===0) return fracStr;
  if (fracStr) return whole+fracStr;
  if (frac===0) return String(whole);
  return val.toFixed(2).replace(/0+$/,'').replace(/\.$/,'');
}

function formatScaledQty(val, unit) {
  const u = (unit||'count').toLowerCase();
  if (u==='count') return formatFraction(Math.round(val*2)/2);
  if (u==='tsp'||u==='tbsp') return formatFraction(Math.round(val*4)/4)+' '+u;
  if (u==='g'||u==='ml') {
    let r;
    if (val<10) r=Math.round(val*2)/2;
    else if (val<100) r=Math.round(val);
    else if (val<1000) r=Math.round(val/5)*5;
    else r=Math.round(val/10)*10;
    return (Number.isInteger(r)?r:r.toFixed(1))+u;
  }
  if (u==='kg'||u==='l') return val.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')+u;
  return val.toFixed(1).replace(/\.0$/,'')+(u!=='count'?u:'');
}

function scaleQty(qty, factor) {
  if (!qty||qty==='—') return qty;
  const parsed = parseQty(qty);
  if (!parsed) return qty;
  return formatScaledQty(parsed.value*factor, parsed.unit);
}

function scaleFactor(r) { return state.servings/(r.baseServings||2); }

function scaleMethodText(text, factor) {
  if (!text) return text;
  const re = /(\d+(?:[\.½¼¾]\d*)?|\d*½|\d*¼|\d*¾)\s*(ml|g|kg|L|l|tbsp|tsp)?\s*\[([^\]]+)\]\s*\[([^\]]+)\]/g;
  return text.replace(re, (match, valStr, explicitUnit, b1) => {
    let unit = explicitUnit;
    if (!unit) { const um=b1.match(/(ml|g|kg|L|l|tbsp|tsp)/i); if(um) unit=um[1]; }
    const num = parseFloat(valStr.replace(/½/g,'.5').replace(/¼/g,'.25').replace(/¾/g,'.75'));
    if (isNaN(num)) return match;
    return formatScaledQty(num*factor, unit||'count');
  });
}

// ============ Aisle categorisation ============

const AISLE_ORDER = [
  'Produce','Meat & Fish','Dairy & Chilled','Bakery','Frozen',
  'Pantry & Dry','Spices & Herbs','Sauces & Pastes','Stocks','Nuts & Dried Fruit','Other'
];
const PANTRY_CATEGORIES = ['Spices & Herbs','Sauces & Pastes','Stocks','Pantry & Dry','Nuts & Dried Fruit'];

function categorize(name) {
  const n = name.toLowerCase().trim();
  if (/^(ground|dried|smoked sea salt|smoked salt)\b/.test(n)) return 'Spices & Herbs';
  if (/\b(ras el hanout|baharat|garam masala|curry powder|umami seasoning|shichimi togarashi|cardamom pod|chilli flakes|paprika|turmeric|cumin)\b/.test(n)) return 'Spices & Herbs';
  if (/\b(sesame seeds|seasoning)\b/.test(n)) return 'Spices & Herbs';
  if (/\bstock(\s|$)/.test(n)) return 'Stocks';
  if (/\b(chicken|beef|lamb|pork|chorizo|haddock|basa|prawn|salmon|cod|sausage|bacon|mince)\b/.test(n)) return 'Meat & Fish';
  if (/\b(yoghurt|yogurt|cream|cheese|paneer|tofu|butter|milk|egg)\b/.test(n)) return 'Dairy & Chilled';
  if (/\b(sauce|paste|mirin|honey|vinegar|mayo|mayonnaise|rice wine|sriracha|cultured coconut|tamarind|hoisin)\b/.test(n)) return 'Sauces & Pastes';
  if (/\b(bread|pita|tortilla|naan|panko|breadcrumb)\b/.test(n)) return 'Bakery';
  if (/\b(almond|pine nut|pine kernel|kernel|apricot|date|raisin|cashew|walnut|pistachio|sultana)\b/.test(n)) return 'Nuts & Dried Fruit';
  if (/^blanched|^frozen/.test(n)) return 'Frozen';
  if (/\b(rice|basmati|arborio|pasta|orzo|couscous|bulgur|gnocchi|flour|sugar|cornflour|noodle)\b/.test(n)) return 'Pantry & Dry';
  if (/crispy onion/.test(n)) return 'Pantry & Dry';
  if (/\b(onion|garlic|ginger|tomato|lemon|lime|parsley|coriander|mint|basil|spinach|lettuce|broccoli|tenderstem|potato|carrot|cabbage|pepper|courgette|chilli|avocado|salad|slaw|green bean|cherry|cucumber|aubergine|kale|leek|chive)\b/.test(n)) return 'Produce';
  return 'Other';
}

// ============ State ============

const state = {
  filters: { protein: new Set(), cuisine: new Set(), time: new Set() },
  selected: new Set(), servings: loadServings(),
  openRecipeId: null, shoppingListOpen: false,
  sourceFilter: 'all'
};

function matches(r) {
  if (state.sourceFilter === 'mine') {
    const isOwn = r.firestoreId
      ? (currentUser && r.userId === currentUser.uid)
      : !!r.custom;
    if (!isOwn) return false;
  }
  if (state.sourceFilter === 'community') {
    if (!r._fsSource || !r.isPublic) return false;
    if (currentUser && r.userId === currentUser.uid) return false;
  }
  const { protein, cuisine, time } = state.filters;
  if (protein.size && !protein.has(r.protein)) return false;
  if (cuisine.size && !cuisine.has(r.cuisine)) return false;
  if (time.size) { const tb=timeBucket(r.timeMinutes); if(!tb||!time.has(tb)) return false; }
  return true;
}
function visibleRecipes() { return allRecipes().filter(matches); }

// ============ Servings ============

function setServings(n) {
  state.servings = Math.max(1, Math.min(50, n));
  saveServings(state.servings);
  updateServingsDisplay();
  if (state.shoppingListOpen) openShoppingList();
  else if (state.openRecipeId) {
    const r = allRecipes().find(x=>x.id===state.openRecipeId);
    if (r) openRecipe(r);
  }
}
function updateServingsDisplay() {
  document.getElementById('servings-value').textContent = state.servings;
  document.getElementById('servings-minus').disabled = state.servings <= 1;
}

// ============ Renderers ============

function renderFilters() {
  const srcEl = document.getElementById('filter-source');
  if (srcEl) {
    srcEl.innerHTML = '';
    const srcOpts = [['all','All recipes'],['mine','My recipes'],['community','Community']];
    srcOpts.forEach(([val, label]) => {
      srcEl.appendChild(el('button', {
        class: 'pill' + (state.sourceFilter === val ? ' active' : ''),
        type: 'button',
        onclick: () => { state.sourceFilter = val; renderFilters(); renderGrid(); }
      }, label));
    });
  }

  const all      = allRecipes();
  const proteins = [...new Set(all.map(r=>r.protein).filter(Boolean))].sort();
  const cuisines = [...new Set(all.map(r=>r.cuisine).filter(Boolean))].sort();
  const times    = TIME_ORDER.filter(t=>all.some(r=>timeBucket(r.timeMinutes)===t));
  function fillGroup(id, options, key) {
    const c = document.getElementById(id); c.innerHTML = '';
    options.forEach(opt => c.appendChild(el('button', {
      class: 'pill'+(state.filters[key].has(opt)?' active':''), type: 'button',
      onclick: ()=>toggleFilter(key,opt)
    }, opt)));
  }
  fillGroup('filter-protein', proteins, 'protein');
  fillGroup('filter-cuisine', cuisines, 'cuisine');
  fillGroup('filter-time',    times,    'time');
}

function toggleFilter(key, value) {
  const s=state.filters[key]; if(s.has(value)) s.delete(value); else s.add(value);
  renderFilters(); renderGrid();
}
function clearFilters() {
  state.filters.protein.clear(); state.filters.cuisine.clear(); state.filters.time.clear();
  renderFilters(); renderGrid();
}

function renderCard(r) {
  const inBasket = state.selected.has(r.id);
  const card = el('button', {
    class: 'card' + (inBasket ? ' in-basket' : ''),
    type: 'button', onclick: ()=>onCardClick(r)
  });

  // Basket button — top-right of card
  const basketBtn = el('button', {
    class: 'card-basket-btn' + (inBasket ? ' in-basket' : ''),
    type: 'button',
    title: inBasket ? 'Remove from basket' : 'Add to shopping basket',
    onclick: (e) => { e.stopPropagation(); toggleBasket(r.id); }
  }, '🛒');
  card.appendChild(basketBtn);

  if (r.image) card.appendChild(el('img', { class:'card-image', src:r.image, alt:r.name }));

  const top = el('div', { class:'card-top' });
  top.appendChild(el('div', { class:'rcode' }, (r.id||'')+(r.id&&r.source?' · ':'')+(r.source||'')));
  top.appendChild(el('h2', {}, r.name));
  card.appendChild(top);

  const body = el('div', { class:'card-body' });
  if (r.desc) body.appendChild(el('p', { class:'desc' }, r.desc));
  const tags = el('div', { class:'tags' });
  if (r.time) tags.appendChild(el('span', { class:'tag' }, r.time));
  (r.tags||[]).forEach(t=>tags.appendChild(el('span', { class:'tag '+(t.cls||'') }, t.label)));
  if (r.calories) tags.appendChild(el('span', { class:'tag' }, r.calories));

  // Ownership / community badge
  if (r.firestoreId) {
    if (currentUser && r.userId === currentUser.uid) {
      tags.appendChild(el('span', { class:'tag custom' }, r.isPublic ? 'Yours · Public' : 'Yours · Private'));
    } else if (r.isPublic) {
      // Show creator for community recipes
      if (r._fsSource === 'public' && (!currentUser || r.userId !== currentUser.uid)) {
        const creator = r.userDisplayName || (r.userEmail ? r.userEmail.split('@')[0] : null);
        if (creator) tags.appendChild(el('span', { class:'tag community' }, '👤 ' + creator));
        else tags.appendChild(el('span', { class:'tag community' }, 'Community'));
      } else {
        tags.appendChild(el('span', { class:'tag community' }, 'Community'));
      }
    }
  } else if (r.custom) {
    tags.appendChild(el('span', { class:'tag custom' }, 'Yours'));
  }

  body.appendChild(tags);
  card.appendChild(body);
  return card;
}

function renderGrid() {
  const container = document.getElementById('grid-container');
  container.innerHTML = '';
  const visible = visibleRecipes();
  const total   = allRecipes().length;
  const anyFilter = state.filters.protein.size+state.filters.cuisine.size+state.filters.time.size > 0;
  document.getElementById('filter-count').textContent =
    anyFilter ? `Showing ${visible.length} of ${total} recipes` : `${total} recipes`;
  if (visible.length===0) {
    container.appendChild(el('div', { class:'empty-state' }, 'No recipes match your filters. Try clearing one.'));
    return;
  }
  const grid = el('div', { class:'grid' });
  visible.forEach(r=>grid.appendChild(renderCard(r)));
  container.appendChild(grid);
}

function onCardClick(r) { openRecipe(r); }

// ============ Pantry view ============

function showView(view) {
  document.getElementById('recipes-view').style.display = view==='recipes'?'block':'none';
  document.getElementById('pantry-view').style.display  = view==='pantry' ?'block':'none';
  document.querySelectorAll('.view-tab').forEach(t=>t.classList.toggle('active',t.dataset.view===view));
  if (view==='pantry') renderPantry();
}

function renderPantry() {
  const c = document.getElementById('pantry-content'); c.innerHTML = '';
  const map = new Map();
  allRecipes().forEach(r=>{
    (r.ingredients||[]).forEach(([name])=>{
      const cat = categorize(name);
      if (!PANTRY_CATEGORIES.includes(cat)) return;
      const key = normaliseName(name);
      if (!map.has(key)) map.set(key,{name,category:cat,recipes:[]});
      map.get(key).recipes.push(r);
    });
  });
  const intro = el('div',{class:'pantry-intro'});
  intro.appendChild(document.createTextNode('Spices, sauces, pastes, stocks and dry goods used across your recipes. '));
  intro.appendChild(el('strong',{},'Stock these once'));
  intro.appendChild(document.createTextNode(' and many recipes become possible without a special shop. Sorted by how many recipes use each item.'));
  c.appendChild(intro);
  PANTRY_CATEGORIES.forEach(cat=>{
    const items=[...map.values()].filter(it=>it.category===cat).sort((a,b)=>b.recipes.length-a.recipes.length||a.name.localeCompare(b.name));
    if (!items.length) return;
    const sec=el('div',{class:'pantry-section'});
    sec.appendChild(el('h3',{},document.createTextNode(cat),el('span',{class:'pantry-count'},items.length+' item'+(items.length===1?'':'s'))));
    const list=el('ul',{class:'pantry-list'});
    items.forEach(it=>{
      const li=el('li',{class:'pantry-item'});
      const hdr=el('div',{class:'pantry-item-header'});
      hdr.appendChild(el('span',{class:'pantry-item-name'},it.name));
      hdr.appendChild(el('span',{class:'pantry-item-recipes-count'},'Used in '+it.recipes.length+' recipe'+(it.recipes.length===1?'':'s')));
      li.appendChild(hdr);
      const tagWrap=el('div',{class:'pantry-recipe-tags'});
      it.recipes.forEach(r=>tagWrap.appendChild(el('button',{class:'pantry-recipe-tag',type:'button',onclick:()=>{showView('recipes');openRecipe(r);}},r.name)));
      li.appendChild(tagWrap); list.appendChild(li);
    });
    sec.appendChild(list); c.appendChild(sec);
  });
  if (!c.children.length||c.children.length===1) c.appendChild(el('div',{class:'empty-state'},'No pantry items found yet.'));
}

// ============ Basket ============

function toggleBasket(id) {
  if (state.selected.has(id)) state.selected.delete(id); else state.selected.add(id);
  updateBasketCount();
  renderGrid();
}

function updateBasketCount() {
  const n = state.selected.size;
  const badge = document.getElementById('basket-count');
  if (badge) { badge.textContent = n || ''; badge.classList.toggle('show', n > 0); }
}

function clearSelected() { state.selected.clear(); updateBasketCount(); renderGrid(); }

// ============ Shopping list ============

function normaliseName(s) { return s.toLowerCase().replace(/\(.*?\)/g,'').replace(/[*]/g,'').trim(); }

// Firestore can't store nested arrays — convert ingredients to/from objects
function ingredientsToFs(arr)   { return (arr||[]).map(([n,q])=>({n:n||'',q:q||''})); }
function ingredientsFromFs(arr) { return (arr||[]).map(i=>Array.isArray(i)?i:[i.n||'',i.q||'']); }

function buildShoppingList() {
  const selected = allRecipes().filter(r=>state.selected.has(r.id));
  const map = new Map();
  selected.forEach(r=>{
    const factor = scaleFactor(r);
    (r.ingredients||[]).forEach(([name,qty])=>{
      const key = normaliseName(name);
      if (!map.has(key)) map.set(key,{name,byUnit:{},hasUnparsed:false,recipes:new Set()});
      const entry = map.get(key);
      const parsed = parseQty(qty);
      if (!parsed) { entry.hasUnparsed=true; }
      else { const u=parsed.unit.toLowerCase(); entry.byUnit[u]=(entry.byUnit[u]||0)+parsed.value*factor; }
      entry.recipes.add(r.name);
    });
  });
  const items=[];
  for (const [,group] of map) {
    const parts=Object.entries(group.byUnit).map(([u,v])=>formatScaledQty(v,u));
    if (group.hasUnparsed) parts.push('+ unknown qty');
    items.push({name:group.name,total:parts.join(' + ')||'—',recipes:[...group.recipes],category:categorize(group.name)});
  }
  items.sort((a,b)=>a.name.localeCompare(b.name));
  const byCategory=new Map();
  items.forEach(it=>{if(!byCategory.has(it.category))byCategory.set(it.category,[]);byCategory.get(it.category).push(it);});
  const groups=[];
  AISLE_ORDER.forEach(cat=>{if(byCategory.has(cat))groups.push({category:cat,items:byCategory.get(cat)});});
  for(const[cat,list]of byCategory){if(!AISLE_ORDER.includes(cat))groups.push({category:cat,items:list});}
  return {items,groups,selectedRecipes:selected};
}

function openShoppingList() {
  state.shoppingListOpen=true; state.openRecipeId=null;
  const {items,groups,selectedRecipes}=buildShoppingList();
  const c=document.getElementById('modal-content'); c.innerHTML='';
  c.appendChild(el('h1',{},'Shopping list'));
  c.appendChild(el('div',{class:'meta'},`${selectedRecipes.length} recipe${selectedRecipes.length===1?'':'s'} · scaled for ${state.servings} servings · ${items.length} ingredients · grouped by aisle`));
  const pillRow=el('div',{class:'recipes-pill-row'});
  selectedRecipes.forEach(r=>pillRow.appendChild(el('span',{class:'tag'},r.name)));
  c.appendChild(pillRow);
  let idx=0;
  groups.forEach(group=>{
    const sec=el('div',{class:'shop-list-section'});
    sec.appendChild(el('h3',{},document.createTextNode(group.category),el('span',{class:'aisle-count'},group.items.length+' item'+(group.items.length===1?'':'s'))));
    const list=el('ul',{class:'shop-list'});
    group.items.forEach(it=>{
      const id='shop-item-'+(idx++);
      const li=el('li');
      const cb=el('input',{type:'checkbox',id});
      cb.addEventListener('change',()=>li.classList.toggle('checked',cb.checked));
      const label=el('label',{for:id});
      label.appendChild(el('div',{class:'item-row'},el('span',{class:'item-name'},it.name),el('span',{class:'item-qty'},it.total)));
      if(it.recipes.length>0) label.appendChild(el('div',{class:'item-recipes'},it.recipes.length===selectedRecipes.length?'all selected recipes':it.recipes.join(' · ')));
      li.appendChild(cb); li.appendChild(label); list.appendChild(li);
    });
    sec.appendChild(list); c.appendChild(sec);
  });
  const pantryItems=new Set();
  selectedRecipes.forEach(r=>{if(r.pantry)r.pantry.split(/,\s*/).forEach(x=>pantryItems.add(x.trim()));});
  if(pantryItems.size) c.appendChild(el('div',{class:'pantry-callout'},el('strong',{},"You'll also need (kitchen staples): "),document.createTextNode([...pantryItems].sort().join(', '))));
  const allergens=new Set();
  selectedRecipes.forEach(r=>{if(r.allergens)r.allergens.split(/,\s*/).forEach(x=>allergens.add(x.trim()));});
  if(allergens.size) c.appendChild(el('div',{class:'pantry-callout'},el('strong',{},'Allergens across these recipes: '),document.createTextNode([...allergens].sort().join(', '))));
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
}

// ============ Recipe modal ============

function openRecipe(r) {
  state.openRecipeId=r.id; state.shoppingListOpen=false;
  const factor=scaleFactor(r), base=r.baseServings||2;
  const c=document.getElementById('modal-content'); c.innerHTML='';

  if(r.image) c.appendChild(el('img',{class:'modal-photo',src:r.image,alt:r.name}));
  if(r.id||r.source) c.appendChild(el('div',{class:'meta'},r.id?el('span',{class:'meta-rcode'},r.id):null,document.createTextNode((r.id&&r.source?' · ':'')+(r.source||''))));
  c.appendChild(el('h1',{},r.name));
  const metaLine=[r.time,r.calories,r.cuisine,r.protein].filter(Boolean).join(' · ');
  if(metaLine) c.appendChild(el('div',{class:'meta'},metaLine));
  if(r.tags&&r.tags.length){const tw=el('div',{class:'meta-tags'});r.tags.forEach(t=>tw.appendChild(el('span',{class:'tag '+(t.cls||'')},t.label)));c.appendChild(tw);}
  if(r.link){const lbl=r.linkType==='instagram'?'View on Instagram':'Open original recipe';c.appendChild(el('a',{class:'modal-link-btn',href:r.link,target:'_blank',rel:'noopener'},lbl+' ↗'));}
  if(r.desc) c.appendChild(el('p',{},r.desc));

  if(r.ingredients&&r.ingredients.length){
    const sec=el('div',{class:'modal-section'});
    sec.appendChild(el('h3',{},document.createTextNode('Ingredients'),el('span',{class:'section-meta'},'For '+state.servings+' servings'+(factor!==1?' (recipe base: '+base+')':''))));
    const list=el('ul',{class:'ingredients'});
    r.ingredients.forEach(([item,qty])=>list.appendChild(el('li',{},el('span',{},item),el('span',{class:'qty'},scaleQty(qty,factor)||'—'))));
    sec.appendChild(list);
    if(r.pantry)    sec.appendChild(el('div',{class:'pantry'},   el('strong',{},'You need:'),   document.createTextNode(r.pantry)));
    if(r.allergens) sec.appendChild(el('div',{class:'allergens'},el('strong',{},'Allergens:'), document.createTextNode(r.allergens)));
    c.appendChild(sec);
  }

  if(r.method&&r.method.length){
    const sec=el('div',{class:'modal-section'});
    sec.appendChild(el('h3',{},document.createTextNode('Method'),el('span',{class:'section-meta'},factor!==1?'Quantities scaled ×'+factor.toFixed(2).replace(/\.?0+$/,''):'')));
    const list=el('ol',{class:'method'});
    r.method.forEach(step=>list.appendChild(el('li',{},scaleMethodText(step,factor))));
    sec.appendChild(list); c.appendChild(sec);
  }

  // Delete button — only for the recipe's owner
  const isOwner = r.firestoreId
    ? (currentUser && r.userId === currentUser.uid)
    : !!r.custom;

  if (isOwner) {
    const actions=el('div',{class:'modal-actions'});

    // Visibility toggle — only for Firestore recipes (localStorage recipes are always private)
    if (r.firestoreId) {
      const visBtn = el('button', {
        class: 'btn', type: 'button',
        style: 'margin-right:auto',
        onclick: () => toggleRecipeVisibility(r)
      }, r.isPublic ? '🔒 Make private' : '🌍 Make public');
      actions.appendChild(visBtn);
    }

    actions.appendChild(el('button', {
      class: 'btn', type: 'button',
      onclick: () => { closeModal(); openEditRecipe(r); }
    }, '✏ Edit recipe'));
    actions.appendChild(el('button',{class:'btn danger',type:'button',onclick:()=>deleteCustomRecipe(r.id)},'Delete this recipe'));
    c.appendChild(actions);
  }

  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow='';
  state.openRecipeId=null; state.shoppingListOpen=false;
}

function openEditRecipe(r) {

async function submitEditRecipe(original) {
  const name = document.getElementById('r-name').value.trim();
  if (!name) { alert('Please give the recipe a name.'); return; }

  const desc = document.getElementById('r-desc').value.trim();
  const cuisine = document.getElementById('r-cuisine').value.trim();
  const protein = document.getElementById('r-protein').value.trim();
  const timeMin = parseInt(document.getElementById('r-time').value);
  const baseServings = parseInt(document.getElementById('r-base-servings').value) || 2;
  const pantry = document.getElementById('r-pantry').value.trim();
  const allergens = document.getElementById('r-allergens').value.trim();
  const ingredientsRaw = document.getElementById('r-ingredients').value.trim();
  const methodRaw = document.getElementById('r-method').value.trim();

  const ingredients = ingredientsRaw
    ? ingredientsRaw.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const sep = l.search(/[:|]/); return sep > -1 ? [l.slice(0, sep).trim(), l.slice(sep + 1).trim()] : [l, '']; })
    : [];
  const method = methodRaw ? methodRaw.split('\n').map(l => l.replace(/^\d+[.)]\s*/, '').trim()).filter(Boolean) : [];

  const updates = {
    name, desc: desc || null, cuisine: cuisine || null, protein: protein || null,
    timeMinutes: isNaN(timeMin) ? null : timeMin,
    time: !isNaN(timeMin) ? timeMin + ' min' : null,
    baseServings, pantry, allergens, ingredients, method,
    image: addDisplayPhotoData || original.image || null,
  };

  if (original.firestoreId && FIREBASE_ENABLED && currentUser) {
    const visEl = document.getElementById('r-visibility');
    if (visEl) updates.isPublic = visEl.dataset.value === 'public';
    const fsUpdates = Object.assign({}, updates);
    fsUpdates.ingredients = ingredientsToFs(updates.ingredients);
    // Remove nulls
    Object.keys(fsUpdates).forEach(k => { if (fsUpdates[k] === null) delete fsUpdates[k]; });
    try {
      await firebaseDb.collection('recipes').doc(original.firestoreId).update(fsUpdates);
      closeModal();
    } catch (e) { alert('Failed to save: ' + e.message); }
  } else {
    // localStorage recipe
    const idx = customRecipes.findIndex(r => r.id === original.id);
    if (idx !== -1) {
      customRecipes[idx] = Object.assign({}, customRecipes[idx], updates);
      saveCustom(customRecipes);
      closeModal(); renderFilters(); renderGrid();
    }
  }
}

async function submitNewRecipe(sourceType) {
  const name=document.getElementById('r-name').value.trim();
  if(!name){alert('Please give the recipe a name.');return;}
  const linkInput=document.getElementById('link-input');
  const link=linkInput?linkInput.value.trim():'';
  if((sourceType==='instagram'||sourceType==='web')&&!link){alert('Please add the link.');return;}

  const desc=document.getElementById('r-desc').value.trim();
  const cuisine=document.getElementById('r-cuisine').value.trim();
  const protein=document.getElementById('r-protein').value.trim();
  const timeMin=parseInt(document.getElementById('r-time').value);
  const baseServings=parseInt(document.getElementById('r-base-servings').value)||2;
  const pantry=document.getElementById('r-pantry').value.trim();
  const allergens=document.getElementById('r-allergens').value.trim();
  const ingredientsRaw=document.getElementById('r-ingredients').value.trim();
  const methodRaw=document.getElementById('r-method').value.trim();

  const ingredients=ingredientsRaw
    ?ingredientsRaw.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const sep=l.search(/[:|]/);return sep>-1?[l.slice(0,sep).trim(),l.slice(sep+1).trim()]:[l,''];})
    :[];
  const method=methodRaw?methodRaw.split('\n').map(l=>l.replace(/^\d+[.)]\s*/,'').trim()).filter(Boolean):[];

  const sourceLabel={photo:'Your photo',instagram:'Instagram',web:'Web link',manual:'Your recipe'}[sourceType];

  const newRecipe={
    id:'C-'+Date.now(), name, source:sourceLabel, custom:true,
    cuisine:cuisine||null, protein:protein||null,
    timeMinutes:isNaN(timeMin)?null:timeMin,
    time:!isNaN(timeMin)?timeMin+' min':null,
    baseServings, desc:desc||null, tags:[],
    ingredients, pantry, allergens, method,
    image:addDisplayPhotoData||null,
    link:(sourceType==='instagram'||sourceType==='web')?link:null,
    linkType:sourceType==='instagram'?'instagram':(sourceType==='web'?'web':null)
  };

  if (FIREBASE_ENABLED && currentUser) {
    // Save to Firestore
    const visEl=document.getElementById('r-visibility');
    const isPublic=visEl?visEl.dataset.value==='public':false;

    // Build clean Firestore document — omit large image blobs and null values
    const fsDoc={};
    ['id','name','source','custom','cuisine','protein','timeMinutes','time','baseServings','desc','tags','pantry','allergens','method','link','linkType'].forEach(k=>{if(newRecipe[k]!=null)fsDoc[k]=newRecipe[k];});
    // Firestore bans nested arrays — store ingredients as objects
    if(newRecipe.ingredients) fsDoc.ingredients = ingredientsToFs(newRecipe.ingredients);
    fsDoc.userId=currentUser.uid;
    fsDoc.userEmail=currentUser.email;
    fsDoc.userDisplayName = currentUser.displayName || loadFirstName() || currentUser.email.split('@')[0];
    fsDoc.isPublic=isPublic;
    fsDoc.createdAt=firebase.firestore.FieldValue.serverTimestamp();

    try {
      await firebaseDb.collection('recipes').add(fsDoc);
      closeModal();
      // Realtime listener will add the new recipe to the grid automatically
    } catch(e) {
      alert('Failed to save recipe: '+e.message);
    }
  } else {
    // Not signed in — save to localStorage (original behaviour)
    customRecipes.push(newRecipe);
    try { saveCustom(customRecipes); }
    catch(e) { alert("Couldn't save — probably too much data (large photo). Try a smaller image."); customRecipes.pop(); return; }
    closeModal(); renderFilters(); renderGrid();
  }
}

  if(!confirm("Delete this recipe? This can't be undone.")) return;
  const recipe=allRecipes().find(r=>r.id===id);

async function runOCRExtract(sourceWrap) {
  if (!addRecipeImages.length) { alert('Pick a photo first.'); return; }

  const geminiKey = loadGeminiKey();
  if (!geminiKey) {
    alert(currentUser ? 'AI features are still loading — please try again in a moment.' : 'Please sign in to use AI recipe extraction.');
    return;
  }

  let status = sourceWrap.querySelector('.extract-status');
  if (status) status.remove();
  status = el('div', { class: 'extract-status' }, '✨ Reading recipe with AI… this takes a few seconds.');
  sourceWrap.appendChild(status);

  try {
    // Convert all images to base64 inline_data parts
    const parts = [];
    for (const file of addRecipeImages) {
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      parts.push({ inline_data: { mime_type: file.type || 'image/jpeg', data: base64 } });
    }

    parts.push({ text: `Extract the recipe from this image and return ONLY a JSON object with these exact fields (no markdown, no explanation, no code fences):
{
  "name": "Recipe name",
  "desc": "Brief 1-2 sentence description",
  "cuisine": "e.g. Italian, Asian, British",
  "protein": "e.g. chicken, fish, vegetarian",
  "timeMinutes": 30,
  "baseServings": 4,
  "calories": "486 kcal",
  "allergens": "e.g. gluten, dairy, nuts",
  "pantry": "pantry staples needed",
  "ingredients": [["ingredient name", "quantity e.g. 200g"], ["next ingredient", "qty"]],
  "method": ["Step 1 text", "Step 2 text"]
}
Use null for any fields not visible. Return ONLY the JSON object.` });

    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts }],
          generationConfig: { responseMimeType: 'application/json' }
        })
      }
    );

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err?.error?.message || `Gemini API error ${res.status}`);
    }

    const data = await res.json();
    const finishReason = data.candidates?.[0]?.finishReason;
    if (finishReason && finishReason !== 'STOP') throw new Error(`Gemini stopped with reason: ${finishReason}. Try a clearer photo.`);
    const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    if (!raw) throw new Error('Gemini returned an empty response. Try a clearer photo.');
    const parsed = extractJSON(raw);
    fillFormFromExtract(parsed);

    status.className = 'extract-status success';
    status.textContent = '✓ Recipe extracted! Review the fields below and click Save recipe.';

  } catch (e) {
    console.error(e);
    status.className = 'extract-status error';
    status.textContent = 'Could not extract recipe: ' + e.message;
  }
}

// Robustly pull the JSON object out of a Gemini response,
// even when the model adds preamble text or markdown fences.
function extractJSON(text) {
  const start = text.indexOf('{');
  const end   = text.lastIndexOf('}');
  if (start === -1 || end === -1) throw new Error('No JSON found in the response.');
  return JSON.parse(text.slice(start, end + 1));
}

const GEMINI_RECIPE_PROMPT = `Extract the recipe from this content and return ONLY a JSON object with these exact fields (no markdown, no explanation, no code fences):
{
  "name": "Recipe name",
  "desc": "Brief 1-2 sentence description",
  "cuisine": "e.g. Italian, Asian, British",
  "protein": "e.g. chicken, fish, vegetarian",
  "timeMinutes": 30,
  "baseServings": 4,
  "calories": "486 kcal",
  "allergens": "e.g. gluten, dairy, nuts",
  "pantry": "pantry staples needed",
  "ingredients": [["ingredient name", "quantity e.g. 200g"], ["next ingredient", "qty"]],
  "method": ["Step 1 text", "Step 2 text"]
}
Use null for any fields not present. Return ONLY the JSON object.`;

async function extractRecipeFromWebLink(url, sourceWrap) {
  if (!url) { alert('Please enter a web link first.'); return; }
  const geminiKey = loadGeminiKey();
  if (!geminiKey) {
    alert(currentUser ? 'AI features are still loading — please try again in a moment.' : 'Please sign in to use AI recipe extraction.');
    return;
  }

  let status = sourceWrap.querySelector('.extract-status');
  if (status) status.remove();
  status = el('div', { class:'extract-status' }, '🌐 Fetching page…');
  sourceWrap.appendChild(status);

  try {
    status.textContent = '✨ Reading page with AI…';

    // Use Gemini's built-in URL context — it fetches the page itself, no CORS proxy needed
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          tools: [{ url_context: {} }],
          contents: [{ parts: [{ text: `Visit this recipe page: ${url}\n\n${GEMINI_RECIPE_PROMPT}` }] }]
        })
      }
    );

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err?.error?.message || `Gemini API error ${res.status}`);
    }

    const data = await res.json();
    const finishReason = data.candidates?.[0]?.finishReason;
    if (finishReason && finishReason !== 'STOP') throw new Error(`Gemini stopped with reason: ${finishReason}.`);
    const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    if (!raw) throw new Error('Gemini returned an empty response.');
    const parsed = extractJSON(raw);
    fillFormFromExtract(parsed);

    status.className = 'extract-status success';
    status.textContent = '✓ Recipe extracted! Review the fields below and click Save recipe.';

  } catch (e) {
    console.error(e);
    status.className = 'extract-status error';
    status.textContent = 'Could not extract recipe: ' + e.message;
  }
}

function fillFormFromExtract(r) {
  const set=(id,val)=>{const e=document.getElementById(id);if(e!=null&&val!=null)e.value=val;};
  set('r-name',r.name||''); set('r-desc',r.desc||''); set('r-cuisine',r.cuisine||''); set('r-protein',r.protein||'');
  if(r.timeMinutes!=null) set('r-time',r.timeMinutes);
  if(r.baseServings!=null) set('r-base-servings',r.baseServings);
  set('r-pantry',r.pantry||''); set('r-allergens',r.allergens||'');
  if(Array.isArray(r.ingredients)) set('r-ingredients',r.ingredients.map(p=>Array.isArray(p)?`${p[0]} : ${p[1]||''}`.trim():p).join('\n'));
  if(Array.isArray(r.method)) set('r-method',r.method.join('\n'));
}

// ============ Settings ============

function openSettings() {
  state.openRecipeId=null; state.shoppingListOpen=false;
  const c=document.getElementById('modal-content'); c.innerHTML='';
  c.appendChild(el('h1',{},'Settings'));
  c.appendChild(el('div',{class:'meta'},'Stored locally in your browser only.'));

  // Your name
  const nameRow = el('div', { class: 'form-row' });
  nameRow.appendChild(el('label', { for: 'settings-name-input' }, 'Your name'));
  const nameInput = el('input', { type: 'text', id: 'settings-name-input', placeholder: 'e.g. Giles' });
  nameInput.value = loadFirstName();
  nameRow.appendChild(nameInput);
  nameRow.appendChild(el('div', { class: 'form-hint' }, 'Shown in the title: "[Name] Dans La Cuisine"'));
  c.appendChild(nameRow);

  const actions=el('div',{class:'modal-actions'});
  actions.appendChild(el('button',{class:'btn ghost',type:'button',onclick:closeModal},'Cancel'));
  actions.appendChild(el('button',{class:'btn primary',type:'button',onclick:()=>{
    saveFirstName(nameInput.value.trim());
    updateTitle();
    updateAuthUI();
    closeModal();
  }},'Save'));
  c.appendChild(actions);
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
}

// ============ Wire up ============

document.getElementById('filter-clear') .addEventListener('click', clearFilters);
document.getElementById('add-recipe')   .addEventListener('click', openAddRecipe);
document.getElementById('servings-minus').addEventListener('click',()=>setServings(state.servings-1));
document.getElementById('servings-plus') .addEventListener('click',()=>setServings(state.servings+1));
document.querySelectorAll('.view-tab').forEach(t=>t.addEventListener('click',()=>showView(t.dataset.view)));

function bootstrap() {
  updateServingsDisplay();
  updateAuthUI();
  updateTitle();
  updateBasketCount();
  renderFilters();
  renderGrid();
}

fetch('./recipes.json',{cache:'no-cache'})
  .then(r=>{if(!r.ok) throw new Error('Failed to load recipes.json: HTTP '+r.status);return r.json();})
  .then(data=>{ builtinRecipes=Array.isArray(data)?data:(data.recipes||[]); bootstrap(); })
  .catch(err=>{
    console.error(err); bootstrap();
    const grid=document.getElementById('grid-container');
    if(grid) grid.innerHTML='<div style="padding:40px;text-align:center;color:#B91C1C"><p><strong>Could not load recipes.json.</strong></p><p style="color:#6B7280">'+(err.message||err)+'</p><p style="color:#6B7280">If you opened this file directly (file://), serve it from a local web server instead, e.g. <code>python3 -m http.server</code> in this folder.</p></div>';
  });
</script>
